<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイト模写</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
</head>

<body>
  <header class="Header">
    <div class="HeaderContainer">
      <a class="HeaderLogo" href="/">
        <img class="HeaderLogo__image" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/header-logo.png?utm_source=chatgpt.com" alt="POTEPAN CAMP">
      </a>
      <nav class="HeaderNav">
        <ul class="HeaderNavList">
          <li class="HeaderNavListItem">
            <a class="HeaderNavListItem__link" href="/content">
              <span>CONTENT</span>
              <span>学習内容</span>
            </a>
          </li>
          <li class="HeaderNavListItem">
            <a class="HeaderNavListItem__link" href="/interview">
              <span>INTERVIEW</span>
              <span>受講生の声</span>
            </a>
          </li>
          <li class="HeaderNavListItem">
            <a class="HeaderNavListItem__link" href="/faq">
              <span>FAQ</span>
              <span>よくある質問</span>
            </a>
          </li>
          <li class="HeaderNavListItem">
            <a class="HeaderNavListItem__link" href="/recruit">
              <span>RECRUIT</span>
              <span>採用企業様へ</span>
            </a>
          </li>
          <li class="HeaderNavListItem">
            <a class="HeaderNavListItem__link" href="/courses/free-under-29">
              <span>U29</span>
              <span>29歳以下の方へ</span>
            </a>
          </li>
          <li class="HeaderNavListItem">
            <a class="HeaderNavListItem__button" href="/contact">
              無料カウンセリング
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="FirstView">
      <img class="FirstView__bg-image FirstView__bg-image--main-visual" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/main-visual.webp" alt="メインビジュアル">
      <img class="FirstView__bg-image FirstView__bg-image--left-triangle" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/left-rectangle.svg" alt="三角形（左上）">
      <img class="FirstView__bg-image FirstView__bg-image--right-triangle" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/right-rectangle.svg" alt="三角形（右下）">
      <img class="FirstView__bg-image FirstView__bg-image--left-oval" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/fill-rectangle.svg" alt="長い円形">
      <div class="FirstView__container">
        <div class="FirstViewContent">
          <h2 class="FirstViewContent__title">
            実践的カリキュラムと
            <br>
            豊富な提携求人で
            <br>
            確実にITエンジニアへ
          </h2>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
